<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy meta tag
      ──────────────────────────────────
      This tag enforces CSP during local development (vite dev) and vite
      preview, where the nginx header is not present.

      In production the nginx `Content-Security-Policy` HTTP header takes
      precedence; this tag acts as a belt-and-suspenders fallback.

      NOTE: `frame-ancestors` is intentionally absent here — browsers ignore
      that directive when it appears in a <meta> tag; it MUST be set as an
      HTTP header (done in nginx.conf).

      Origins are the testnet / local-dev defaults from .env.example.
      Swap VITE_API_BASE and VITE_STELLAR_RPC_URL if your local stack differs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' http://127.0.0.1:5050 https://soroban-testnet.stellar.org; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
