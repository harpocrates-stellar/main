server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──────────────────────────────────────────────────────
  #
  # Content-Security-Policy
  # ────────────────────────
  # Origins injected here are the PRODUCTION values.  For other environments
  # substitute VITE_API_BASE and VITE_STELLAR_RPC_URL accordingly (see
  # docs/csp.md for guidance on staging / local overrides).
  #
  # Directive rationale:
  #   script-src   – 'strict-dynamic' lets Vite-generated ES-module chunks
  #                  load without 'unsafe-inline'.  'wasm-unsafe-eval' is
  #                  required by @aztec/bb.js (UltraHonkBackend) for in-browser
  #                  ZK proof generation via WebAssembly.  No raw JS eval.
  #   style-src    – self-hosted bundled CSS only; no external sheets or
  #                  inline style attributes.
  #   connect-src  – backend API + Stellar Soroban RPC only.  Freighter wallet
  #                  extension communicates via postMessage (not fetch/XHR) and
  #                  therefore does not need a connect-src entry.
  #   worker-src   – @aztec/bb.js spawns WASM workers from blob: URLs.
  #   child-src    – belt-and-suspenders for older browsers that ignore
  #                  worker-src.
  #   img-src      – same-origin favicon SVG + data: URIs generated by the UI.
  #   font-src     – all fonts are self-hosted (bundled by Vite).
  #   object-src   – disables Flash and all plugin types.
  #   frame-ancestors – prevents clickjacking / credential-overlay attacks.
  #   frame-src    – no iframes inside the app.
  #   base-uri     – prevents <base> tag hijacking of relative URLs.
  #   form-action  – plain HTML form submissions stay on the same origin.
  #
  # Environment-specific origins — replace the placeholders below with the
  # real values for each deployment target:
  #   Production :  VITE_API_BASE=https://api.harpocrates.example
  #                 VITE_STELLAR_RPC_URL=https://soroban-mainnet.stellar.org
  #   Testnet    :  VITE_API_BASE=https://api-testnet.harpocrates.example
  #                 VITE_STELLAR_RPC_URL=https://soroban-testnet.stellar.org
  #   Local dev  :  VITE_API_BASE=http://127.0.0.1:5050
  #                 VITE_STELLAR_RPC_URL=https://soroban-testnet.stellar.org
  #
  # The two $VITE_* placeholders are resolved by the Docker build (via an
  # envsubst pass) or by your CI/CD pipeline before the image is published.
  # See docs/csp.md for the full substitution procedure.
  add_header Content-Security-Policy "script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' $VITE_API_BASE $VITE_STELLAR_RPC_URL; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy same-site always;
  add_header X-Frame-Options DENY always;

  location ~* \.(wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/wasm;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
