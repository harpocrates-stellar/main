[package]
name = "harpocrates-registry"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Exposes the Wasm size-budget constants to host-side tooling (#346).
# This feature never changes contract storage or entrypoints and must not be
# enabled for production artifacts.
wasm-size-budget = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
