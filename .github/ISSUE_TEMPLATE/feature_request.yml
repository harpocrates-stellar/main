name: Feature Request
description: Suggest an idea or new feature for Harpocrates
title: "[Feature]: "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Harpocrates! Please describe your proposed feature or enhancement below.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of the codebase does this feature target?
      options:
        - "Frontend (React / Evidence Studio & Portal)"
        - "Backend (Flask / Metadata Service)"
        - "Contracts (Soroban / Registry & Verifier)"
        - "ZK / Circuits (Noir / UltraHonk)"
        - "DevX / CI / Documentation"
        - "Other / New Area"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Is your feature request related to a specific problem or a new capability? Please explain.
      placeholder: Summarize what you would like to achieve...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Expected Behavior
      description: Describe the solution or user experience you would like to see implemented.
      placeholder: Describe the desired feature behavior and implementation design...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, designs, mockups, or screenshots about the feature request here.
    validations:
      required: false
