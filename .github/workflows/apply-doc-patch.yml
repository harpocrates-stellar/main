name: apply-doc-patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-focus-restore
          fetch-depth: 0
      - name: Apply ACCESSIBILITY.md update and verify blob hash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          EXPECTED = "cd805525edfa81021d8bebae158ba44af82133ca"
          path = pathlib.Path("frontend/ACCESSIBILITY.md")
          lines = path.read_text(encoding="utf-8").split("\n")
          def find(pred, label):
              hits = [i for i, line in enumerate(lines) if pred(line)]
              if len(hits) != 1:
                  sys.exit("anchor %r matched %d lines" % (label, len(hits)))
              return hits[0]
          i = find(lambda line: line.strip() == "Four exported hooks:", "hook count")
          lines[i] = "Five exported hooks:"
          names = [
              "useLiveRegion(politeness?)",
              "useA11yStage(stage)",
              "useFocusReturn(ref, bool)",
              "useSkipLink()",
              "useStageFocus(stage, statusRef, nextRef?)",
          ]
          docs = [
              "{ message, announce }",
              "{ statusLabel, isBusy }",
              "void (side-effect: returns focus on false)",
              "{ mainRef, handleSkip }",
              "void (side-effect: restores focus after a stage change)",
          ]
          positions = [find(lambda line, n=n: line.startswith(n), n) for n in names[:4]]
          if positions != list(range(positions[0], positions[0] + 4)):
              sys.exit("hook list lines are not contiguous")
          width = max(len(n) for n in names) + 2
          lines[positions[0]:positions[0] + 4] = [
              "%s→  %s" % (name.ljust(width), doc) for name, doc in zip(names, docs)
          ]
          j = find(lambda line: line.startswith("`useLiveRegion.announce` runs every message through"), "useLiveRegion.announce")
          paragraph = (
              "`useStageFocus` records the last focused element and only moves focus when a stage "
              "change removes or disables that control (for example, the Cancel button disappearing "
              "when a flow is cancelled). Once a package is `ready` it focuses the Register proof "
              "control; every other stage focuses the `.sr-only` `#studio-stage-heading`. Updates "
              "that do not change the stage, such as hash progress percentages, never move focus, "
              "and the heading is scoped so assistive technology does not re-announce the "
              "surrounding page."
          )
          lines[j:j] = [paragraph, ""]
          k = find(lambda line: line.startswith("| 2.4.3 Focus Order |"), "2.4.3")
          if not lines[k].endswith(" |"):
              sys.exit("2.4.3 row does not end with a table cell delimiter")
          lines[k] = lines[k][:-2] + (
              "; evidence-stage transitions restore focus to the Studio status heading (or the "
              "Register proof control once a package is ready) only when the focused control was "
              "removed or disabled |"
          )
          m = find(lambda line: line.startswith("| 4.1.3 Status Messages |"), "4.1.3")
          row = lines[m]
          fragment = "`.sr-only` live region and"
          if row.count(fragment) != 1:
              sys.exit("4.1.3 row fragment matched %d times" % row.count(fragment))
          row = row.replace(fragment, "`.sr-only` `#studio-stage-heading` (an `<h3>`) and")
          if not row.endswith(" |"):
              sys.exit("4.1.3 row does not end with a table cell delimiter")
          lines[m] = row[:-2] + (
              ". Stage focus restoration targets the concise heading, so a stage change announces "
              "the status instead of re-reading the page |"
          )
          path.write_text("\n".join(lines), encoding="utf-8")
          sha = subprocess.run(["git", "hash-object", str(path)], capture_output=True, text=True, check=True).stdout.strip()
          print("blob sha:", sha)
          if sha != EXPECTED:
              sys.exit("MISMATCH: %s != %s" % (sha, EXPECTED))
          print("OK")
          PY
          git config user.name "jdegen808"
          git config user.email "jdegen808@users.noreply.github.com"
          git add frontend/ACCESSIBILITY.md
          if git diff --cached --quiet; then
            echo "no change to apply"
            exit 0
          fi
          git commit -m "docs(frontend): document useStageFocus stage-focus restoration"
          git push origin HEAD:feat/studio-focus-restore
