name: Security & Vulnerability Scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to scan history

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-scan:
    name: Dependency Vulnerability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Frontend (npm)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (Frontend)
        working-directory: frontend
        run: npm audit --production --audit-level=high || true

      # Backend (Python)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit (Backend)
        working-directory: backend
        run: pip-audit -r requirements.txt || true

      # Contracts (Rust)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit (Contracts)
        working-directory: contracts
        run: cargo audit
