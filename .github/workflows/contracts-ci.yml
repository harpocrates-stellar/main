name: Contracts CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "zk/vectors/**"
      - ".github/workflows/contracts-ci.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "zk/vectors/**"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Soroban contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: contracts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run contract tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee contracts-test.log

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-test-failure-${{ github.run_id }}
          path: contracts/contracts-test.log
          if-no-files-found: warn
          retention-days: 7
