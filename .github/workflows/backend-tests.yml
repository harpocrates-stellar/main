name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      APP_ENV: testing
      CORS_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1:5173
      DATABASE_URL: ""
      NOIR_WORKER_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg for video steganography tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt

      - name: Run backend tests
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -v 2>&1 | tee backend-test.log

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-failure-${{ github.run_id }}
          path: backend/backend-test.log
          if-no-files-found: warn
          retention-days: 7
