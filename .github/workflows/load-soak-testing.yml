name: Load and Soak Testing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - soak
          - both
      concurrency:
        description: 'Number of concurrent workers'
        required: false
        default: 4
        type: number
      total_ops:
        description: 'Total operations per test type'
        required: false
        default: 100
        type: number
      soak_minutes:
        description: 'Soak test duration in minutes'
        required: false
        default: 10
        type: number
  schedule:
    # Nightly soak test
    - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: load-soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  CORS_ORIGINS: http://localhost
  DATABASE_URL: ""
  NOIR_WORKER_ENABLED: "false"
  BACKEND_PORT: 5050

jobs:
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg for video steganography tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Install pinned dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt
          .venv/bin/python -m pip install requests 2>/dev/null || true

      - name: Start backend server
        run: |
          cd backend
          .venv/bin/python -m gunicorn \
            --bind 127.0.0.1:$BACKEND_PORT \
            --workers 2 \
            --threads 4 \
            --timeout 240 \
            app:app &
          sleep 3
          for i in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/health" > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done

      - name: Run load test
        run: |
          cd backend
          .venv/bin/python load_test.py \
            --base-url "http://127.0.0.1:$BACKEND_PORT" \
            --mode "${{ inputs.mode || 'load' }}" \
            --concurrency "${{ inputs.concurrency || 4 }}" \
            --total-ops "${{ inputs.total_ops || 100 }}" \
            --output /tmp/load-test-report.json

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-${{ github.run_id }}
          path: /tmp/load-test-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Check load test thresholds
        if: always()
        run: |
          if [ -f /tmp/load-test-report.json ]; then
            VIOLATIONS=$(python3 -c "
            import json
            with open('/tmp/load-test-report.json') as f:
                report = json.load(f)
            violations = report.get('violations', [])
            if violations:
                print('THRESHOLD VIOLATIONS:')
                for v in violations:
                    print(f'  ! {v}')
                sys.exit(1)
            else:
                print('All thresholds passed')
            " 2>&1) || {
              echo "$VIOLATIONS"
              echo "::warning::Load test threshold violations detected"
            }
          fi

  soak-test:
    name: Soak Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: load-test
    if: github.event_name == 'schedule' || (inputs.mode == 'soak' || inputs.mode == 'both')

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pinned dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt
          .venv/bin/python -m pip install requests

      - name: Start backend server
        run: |
          cd backend
          .venv/bin/python -m gunicorn \
            --bind 127.0.0.1:$BACKEND_PORT \
            --workers 2 \
            --threads 4 \
            --timeout 240 \
            app:app &
          sleep 3
          for i in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/health" > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done

      - name: Run soak test
        run: |
          cd backend
          .venv/bin/python load_test.py \
            --base-url "http://127.0.0.1:$BACKEND_PORT" \
            --mode soak \
            --concurrency "${{ inputs.concurrency || 4 }}" \
            --soak-minutes "${{ inputs.soak_minutes || 10 }}" \
            --output /tmp/soak-test-report.json

      - name: Upload soak test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-test-report-${{ github.run_id }}
          path: /tmp/soak-test-report.json
          retention-days: 30
          if-no-files-found: warn
