name: Scheduled fuzzing

on:
  schedule:
    - cron: "17 3 * * 0"   # weekly, Sunday 03:17 UTC (off the hour on purpose)
  workflow_dispatch:
    inputs:
      mutation_only:
        description: "Run only the Noir constraint mutation checks"
        type: boolean
        required: false
        default: false
      iterations:
        description: "Iterations per fuzz target (digits only)"
        required: false
        default: "10000"
      seed:
        description: "Fuzz seed (digits only). Empty = run id"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scheduled-fuzzing
  cancel-in-progress: false

jobs:
  constraint-mutation:
    name: Mutation-test Noir constraints
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned Nargo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NARGO_VERSION="$(python3 -c "import json; print(json.load(open('zk/toolchain.lock.json'))['toolchain']['nargo']['version'])")"
          mkdir -p "$RUNNER_TEMP/nargo"
          gh release download "v$NARGO_VERSION" --repo noir-lang/noir \
            --pattern 'nargo-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP/nargo"
          tar -xzf "$RUNNER_TEMP/nargo/nargo-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/nargo"
          "$RUNNER_TEMP/nargo/nargo" --version | grep -F "$NARGO_VERSION"
          echo "$RUNNER_TEMP/nargo" >> "$GITHUB_PATH"

      - name: Test mutation generation and result classification
        env:
          NARGO: nargo
        run: python3 -m unittest discover -s zk/tools -p test_mutate_constraints.py -v

      - name: Mutation-test every circuit
        run: |
          python3 zk/tools/mutate_constraints.py \
            --budget-seconds 2100 --timeout-seconds 180 \
            --report-dir "$RUNNER_TEMP/constraint-mutations" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation inventory, results and Nargo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constraint-mutation-results
          path: ${{ runner.temp }}/constraint-mutations
          retention-days: 7
          if-no-files-found: warn

  circuit-fuzz:
    if: ${{ !inputs.mutation_only }}
    name: Circuit and proof-input fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ITERATIONS: ${{ inputs.iterations || '10000' }}
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # SET THIS: paste the toolchain setup steps from the existing zk workflow
      # (pinned nargo / bb). Do not change any versions.

      - name: Validate inputs
        run: |
          [[ "$ITERATIONS" =~ ^[0-9]{1,7}$ ]] || { echo "invalid iterations"; exit 1; }
          [[ "$FUZZ_SEED" =~ ^[0-9]{1,18}$ ]] || { echo "invalid seed"; exit 1; }
          echo "fuzz seed: $FUZZ_SEED"

      - name: Fuzz circuit and proof inputs
        run: SET THIS   # command from docs/zk-fuzzing.md; use $ITERATIONS and $FUZZ_SEED if it supports them

      - name: Upload synthetic failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-fuzz-failures
          path: SET THIS   # the fuzzer's crash/failing-input directory
          retention-days: 7
          if-no-files-found: ignore

  parser-fuzz:
    if: ${{ !inputs.mutation_only }}
    name: Parser and codec fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ITERATIONS: ${{ inputs.iterations || '10000' }}
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # SET THIS: language/runtime setup for the parser fuzzer (copy from an existing workflow).

      - name: Validate inputs
        run: |
          [[ "$ITERATIONS" =~ ^[0-9]{1,7}$ ]] || { echo "invalid iterations"; exit 1; }
          [[ "$FUZZ_SEED" =~ ^[0-9]{1,18}$ ]] || { echo "invalid seed"; exit 1; }
          echo "fuzz seed: $FUZZ_SEED"

      - name: Fuzz parsers and verifier-input codec
        run: SET THIS   # command from docs/zk-fuzzing.md / docs/zk-conformance-vectors.md

      - name: Upload synthetic failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-failures
          path: SET THIS
          retention-days: 7
          if-no-files-found: ignore
